name: Check tennis availability alerts

on:
  schedule:
    # GitHub Actions usa UTC. Argentina (UTC-3): 07:00–22:55.
    - cron: "*/5 0-1,10-23 * * *"
  workflow_dispatch:

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Check Brio availability
        run: |
          status="$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://tenis.santivillaabrille.com/api/cron/alertas)"
          cat response.json
          test "$status" -ge 200 && test "$status" -lt 300
